<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration conceptuelle — Les Cendres de Néra : cendres, ruines et braises">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a12"/>
      <stop offset=".6" stop-color="#220d12"/>
      <stop offset="1" stop-color="#4a1414"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".62" r=".5">
      <stop offset="0" stop-color="#D62828" stop-opacity=".6"/>
      <stop offset="1" stop-color="#D62828" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <circle cx="640" cy="440" r="380" fill="url(#glow)"/>
  <!-- arche en ruine -->
  <g fill="#07070b">
    <path d="M380 720 V330 h60 v-40 h60 v40 h40 V720Z"/>
    <path d="M700 720 V360 h50 v-30 h50 v30 h50 V720Z"/>
    <path d="M500 330 Q640 180 780 330 L780 372 Q640 250 500 372Z"/>
    <rect x="560" y="470" width="160" height="14"/>
  </g>
  <!-- feu central -->
  <path d="M640 560 C600 520 618 480 640 440 C650 480 690 500 676 540 C668 556 654 562 640 560Z" fill="#D62828"/>
  <path d="M640 560 C622 538 632 518 642 500 C652 520 664 530 658 548Z" fill="#ffb347" opacity=".9"/>
  <!-- sol de cendres -->
  <path d="M0 620 Q320 590 640 618 T1280 600 V720 H0Z" fill="#07070b"/>
  <!-- cendres qui montent -->
  <g fill="#e8eaf0" opacity=".5">
    <rect x="300" y="210" width="3" height="3"/><rect x="420" y="150" width="2" height="2"/>
    <rect x="560" y="260" width="3" height="3"/><rect x="760" y="180" width="2" height="2"/>
    <rect x="880" y="280" width="3" height="3"/><rect x="990" y="140" width="2" height="2"/>
    <rect x="1100" y="230" width="3" height="3"/><rect x="200" y="320" width="2" height="2"/>
  </g>
  <g fill="#D62828">
    <rect x="610" y="400" width="3" height="3"/><rect x="680" y="380" width="3" height="3"/>
    <rect x="650" y="340" width="2" height="2"/><rect x="590" y="450" width="2" height="2"/>
  </g>
  <!-- silhouette -->
  <g fill="#000" transform="translate(618 520)">
    <path d="M22 0 C8 2 4 22 8 36 L-2 100 H46 L36 36 C40 22 36 2 22 0Z"/>
    <rect x="46" y="20" width="4" height="82" fill="#4169E1"/>
  </g>
  <rect x="0" y="0" width="1280" height="720" fill="none" stroke="#fff" stroke-opacity=".04"/>
</svg>
